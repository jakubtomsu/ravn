name: CI
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build_windows:
    name: Windows Build and Check
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Odin
        shell: cmd
        run: |
          git clone https://github.com/odin-lang/Odin.git --depth 1 --single-branch --branch=master
          cd Odin
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ./build.bat
          ./odin version
          ./odin report

      - name: Check All
        shell: cmd
        run: |
          set "PATH=%CD%\Odin;%PATH%"
          odin check examples -define:GPU_BACKEND=Dummy -define:PLATFORM_BACKEND=Dummy
          odin check examples -define:GPU_BACKEND=D3D11
          odin check examples -define:GPU_BACKEND=WGPU
          odin check examples -define:PLATFORM_BACKEND=SDL3
          odin test examples -all-packages -define:GPU_BACKEND=D3D11 -sanitize:address
          odin test examples -all-packages -define:GPU_BACKEND=WGPU -sanitize:address

  build_linux:
    name: Linux Build and Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
        - uses: actions/checkout@v4
        - name: Install Odin dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y clang llvm libsdl3-dev
        - name: Set up Odin
          run: |
            git clone https://github.com/odin-lang/Odin.git --depth 1 --single-branch --branch=master
            cd Odin
            make
            ./odin version
            ./odin report
        - name: Install dependencies
          run: |
            "$GITHUB_WORKSPACE/Odin/vendor/miniaudio/src/build_miniaudio.sh"
            "$GITHUB_WORKSPACE/Odin/vendor/stb/src/build_stb.sh"
            curl -L https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip -o wgpu.zip
            unzip wgpu.zip -d "$GITHUB_WORKSPACE/Odin/vendor/wgpu/lib/wgpu-linux-x86_64-release"
        - name: Check All
          run: |
            # "$GITHUB_WORKSPACE" To be able to call odin from anywhere in the container's file system
            export PATH="$GITHUB_WORKSPACE/Odin/:$PATH"
            odin check examples -define:GPU_BACKEND=Dummy -define:PLATFORM_BACKEND=Dummy
            odin check examples -define:GPU_BACKEND=WGPU
            odin test examples -all-packages -sanitize:address
            odin test examples -all-packages -sanitize:memory
            odin test examples -all-packages -sanitize:thread

  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # https://github.com/laytan/setup-odin
      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: 'latest'
          branch: 'master'

      - name: Install dependencies
          run: |
            "$GITHUB_WORKSPACE/Odin/vendor/miniaudio/src/build_miniaudio.sh"
            "$GITHUB_WORKSPACE/Odin/vendor/stb/src/build_stb.sh"
            curl -L https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip -o wgpu.zip
            unzip wgpu.zip -d "$GITHUB_WORKSPACE/Odin/vendor/wgpu/lib/wgpu-linux-x86_64-release"

      - name: Run Generator
        run: odin run build/cheatsheet/cheatsheet.odin -file

      - name: Commit changes (only if modified)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto update docs"
          file_pattern: 'docs/cheatsheet.md'
